<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up-form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="container">
        <div id="img-section">
            <img src="assets/potrait.png" alt="" srcset="">
        </div>

        <div class="sign-up-box">
            <div class="first-box">
                <p>Join us and start your journey today. Create your account to unlock new possibilites,stay connected, and turn your ideas into reality</p>
            </div>
            <div class="fill">
                <form action="" class="form-grid">
                    <div class="form-group">
                        <label for="">First name:</label>
                        <input type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="">Last name: </label>
                        <input type="text" required>
                    </div>

                   <div class="form-group">
                        <label for="">Email: </label>
                        <input type="email" required placeholder="you@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="">Phone no.: </label>
                        <input type="tel" minlength="10" maxlength="10" pattern="[0-9]{10}" placeholder="Enter 10 digit mobile no." required>
                    </div>
                    <div class="form-group">
                        <label for="">Password: </label>
                        <input type="text" minlength="6" id="password" required>
                    </div>
                    <div class="form-group">
                        <label for="">Confirm Password: </label>
                        <input type="text" id="confirmPassword" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" id="btn">Create Account</button>
                    </div>
                </form>
            </div>
            <div class="third-box">
                <p>Already have an account? <span><a href="">Log in</a></span></p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
